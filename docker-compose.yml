name: isletme-radari

# Tek ekranlı uygulama: backend (FastAPI) + frontend (Next.js). Veritabanı yok;
# tarama sonuçları oturum içinde gösterilir, saklanmaz.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/scans.db
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      KEEP_ALIVE_TIMEOUT: ${KEEP_ALIVE_TIMEOUT:-120000}
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
