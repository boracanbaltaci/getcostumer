name: isletme-radari

# Tek ekranlı uygulama: backend (FastAPI) + frontend (Next.js) + db (Postgres).
# Kalıcı veri Postgres'te (pgdata volume); ./data'daki eski SQLite dosyası ilk
# açılışta boş Postgres'e tek sefer aktarılır.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 10s
      start_period: 30s
      start_interval: 2s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/scans.db
      DATABASE_URL: postgresql://radar:${POSTGRES_PASSWORD:-radar}@db:5432/radar
    volumes:
      - ./data:/data
    expose:
      - "8000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      start_period: 20s
      start_interval: 2s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      KEEP_ALIVE_TIMEOUT: ${KEEP_ALIVE_TIMEOUT:-120000}
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
